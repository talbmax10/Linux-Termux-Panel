# إعدادات Gradle على مستوى المشروع

# ذاكرة كافية لعمليات kapt/Compose، مع ترميز UTF-8 لدعم النصوص العربية في الموارد والكود
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# تسريع البناء
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# Jetifier غير مطلوب (لا توجد مكتبات دعم قديمة) وتعطيله يسرّع البناء
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official
