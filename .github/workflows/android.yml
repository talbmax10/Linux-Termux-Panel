name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Gradle wrapper
      run: |
        if [ -f gradlew ]; then
          echo "Gradle wrapper found"
        else
          echo "Gradle wrapper not found, generating..."
          # This should not happen if the wrapper is committed, but as a fallback
          gradle wrapper --gradle-version 8.5 --distribution-type all
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Locate the generated APK
      run: |
        echo "APK path: $(find . -name \"app-debug.apk\" -type f)"
        echo "APK_DIR=$(find . -name \"app-debug.apk\" -type f -exec dirname {} \;)" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Termux-Panel-debug-apk
        path: ${{ env.APK_DIR }}/app-debug.apk